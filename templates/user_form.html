{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1 class="page-title">{{ title }}</h1></div>
    <a href="{{ url_for('users.list_users') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Users</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username if user else '' }}" {% if user %}readonly{% endif %} required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name if user else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password {% if not user %}*{% else %}(leave blank to keep unchanged){% endif %}</label>
                    <input type="password" name="password" class="form-control" {% if not user %}required{% endif %}>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select">
                        <option value="worker" {% if user and user.role == 'worker' %}selected{% endif %}>Worker</option>
                        <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="owner" {% if user and user.role == 'owner' %}selected{% endif %}>Owner</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" name="is_active" {% if not user or user.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save User</button>
                <a href="{{ url_for('users.list_users') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
